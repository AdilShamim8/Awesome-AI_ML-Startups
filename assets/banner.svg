  </g>

  <text x="60" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">Awesome AI/ML Startups</text>
  <text x="60" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="url(#accent)" font-weight="600">Monthly Tracker &#183; 103 Companies &#183; Schema v2</text>
  <text x="60" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#94a3b8">Canonical master dataset &#183; verified sources &#183; auto-validated in CI</text>
  <text x="60" y="252" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#64748b">Updated September 7, 2026 &#183; data as of Sep 6&#8211;7, 2026</text>
